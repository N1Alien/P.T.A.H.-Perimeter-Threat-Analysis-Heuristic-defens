services:
  redis:
    image: redis/redis-stack-server:7.4.0-v7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis_data:
